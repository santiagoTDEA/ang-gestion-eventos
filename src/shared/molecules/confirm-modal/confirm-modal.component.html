@if (open()) {
<div class="confirm-modal__fondo" (click)="cancel()">
    <div class="confirm-modal" role="alertdialog" aria-modal="true" [attr.aria-labelledby]="titleId"
        [attr.aria-describedby]="message() ? messageId : null" (click)="$event.stopPropagation()">
        <div class="confirm-modal__icono" [class.confirm-modal__icono--peligro]="variant() === 'danger'"
            aria-hidden="true">
            <svg viewBox="0 0 24 24">
                @if (variant() === 'danger') {
                <path
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                } @else {
                <path
                    d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
                }
            </svg>
        </div>

        <div class="confirm-modal__contenido">
            <h3 [id]="titleId">{{ title() }}</h3>
            @if (message()) {
            <p [id]="messageId">{{ message() }}</p>
            }
            <ng-content />
        </div>

        <div class="confirm-modal__acciones">
            <button #cancelButton type="button" class="confirm-modal__btn confirm-modal__btn--secundario"
                [disabled]="loading()" (click)="cancel()">
                {{ cancelLabel() }}
            </button>
            <button type="button" class="confirm-modal__btn"
                [class.confirm-modal__btn--peligro]="variant() === 'danger'"
                [class.confirm-modal__btn--primario]="variant() === 'primary'"
                [disabled]="loading() || confirmDisabled()"
                (click)="confirm()">
                {{ loading() ? loadingLabel() : confirmLabel() }}
            </button>
        </div>
    </div>
</div>
}
