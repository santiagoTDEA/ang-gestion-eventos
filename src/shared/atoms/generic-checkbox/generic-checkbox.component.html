<label class="flex items-center gap-2 cursor-pointer select-none">
    <input type="checkbox" [formControl]="$any(control)"
        class="w-4 h-4 rounded border-gray-300 text-[#1c4a30] focus:ring-[#1c4a30] cursor-pointer" />
    <span class="text-sm text-gray-700 font-bold">{{ label }}</span>
</label>
