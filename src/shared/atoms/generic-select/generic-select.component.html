<div class="mb-4 relative">
    <label *ngIf="label" class="block text-sm font-bold mb-1.5">{{ label }}</label>

    <button type="button" (click)="toggleOpen()"
        class="w-full flex items-center justify-between border rounded-md px-3 py-2.5
               bg-white text-sm text-left cursor-pointer transition-colors"
        [class.border-[#b9c6e0]]="!showError"
        [class.border-red-400]="showError"
        [class.text-gray-800]="hasValue"
        [class.text-gray-400]="!hasValue">

        <span class="truncate">{{ selectedLabel }}</span>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor"
            class="w-[18px] h-[18px] text-gray-500 shrink-0 ml-2 transition-transform duration-200"
            [class.rotate-180]="isOpen">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
    </button>

    @if (isOpen) {
    <ul class="absolute z-20 mt-1 w-full max-h-60 overflow-auto
               bg-white border border-gray-200 rounded-md shadow-lg
               text-sm py-1">
        @for (option of options; track option) {
        <li (click)="selectOption(option)"
            class="px-3 py-2 cursor-pointer hover:bg-[#eef2fb] transition-colors"
            [class.bg-[#eef2fb]]="getValue(option) === control.value"
            [class.font-medium]="getValue(option) === control.value">
            {{ getLabel(option) }}
        </li>
        }

        @if (options.length === 0) {
        <li class="px-3 py-2 text-gray-400">Sin opciones disponibles</li>
        }
    </ul>
    }

    <p *ngIf="showError" class="text-xs text-red-500 mt-1 font-medium">{{ errorMessage }}</p>
</div>
