<div class="mb-4">
    <label *ngIf="label" class="block text-sm text-[#6b5b3e] mb-1.5">{{ label }}</label>

    <div class="flex items-center bg-[#e7edfb] border rounded-md px-2.5" [class.border-[#b9c6e0]]="!showError"
        [class.border-red-400]="showError">
        <select [formControl]="$any(control)" (blur)="handleBlur()"
            class="flex-1 bg-transparent border-none outline-none py-2.5 px-1 text-sm text-gray-800 appearance-none cursor-pointer">
            <option [ngValue]="null" disabled selected hidden>{{ placeholder }}</option>
            <option *ngFor="let option of options" [ngValue]="getValue(option)">{{ getLabel(option) }}</option>
        </select>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-[18px] h-[18px] text-gray-500 pointer-events-none">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
    </div>

    <p *ngIf="showError" class="text-xs text-red-500 mt-1">{{ errorMessage }}</p>
</div>
